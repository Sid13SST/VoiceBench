<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}VoiceBench{% endblock %}</title>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb; --surface-2: #f2f1ee; --border: #dddcd7;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #6f6e69;
  --accent: #2a78d6; --track: #e6e5e0;
  --good: #0ca30c; --good-text: #006300; --critical: #d03b3b; --critical-text: #a32020;
  --warn-bg: #fff4d6; --warn-border: #fab219;
  --del-bg: #fbe3e3; --ins-bg: #e2f0fb; --sub-bg: #fdf0d5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface: #1a1a19; --surface-2: #242422; --border: #3a3a37;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #9d9c93;
    --accent: #3987e5; --track: #33332f;
    --good-text: #4fcf4f; --critical-text: #f07878;
    --warn-bg: #3a2e10; --warn-border: #fab219;
    --del-bg: #4a2323; --ins-bg: #1e3348; --sub-bg: #43361a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #1a1a19; --surface-2: #242422; --border: #3a3a37;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #9d9c93;
  --accent: #3987e5; --track: #33332f;
  --good-text: #4fcf4f; --critical-text: #f07878;
  --warn-bg: #3a2e10; --warn-border: #fab219;
  --del-bg: #4a2323; --ins-bg: #1e3348; --sub-bg: #43361a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans", "Noto Sans Devanagari", sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
header.top { border-bottom: 1px solid var(--border); padding: 12px 16px; }
header.top a { color: var(--text); text-decoration: none; font-weight: 600; }
h1 { font-size: 22px; margin: 8px 0 4px; } h2 { font-size: 17px; margin: 32px 0 8px; }
.muted { color: var(--text-2); } .small { font-size: 13px; }
a { color: var(--accent); }
code { font-size: 13px; background: var(--surface-2); padding: 1px 4px; border-radius: 4px; }
.banner { border: 1px solid var(--warn-border); background: var(--warn-bg); border-radius: 6px;
  padding: 8px 12px; margin: 8px 0; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-weight: 600; color: var(--text-2); font-size: 13px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.meter { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.meter .track { display: block; flex: 1; height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
.meter .fill { display: block; height: 100%; background: var(--accent); border-radius: 0 3px 3px 0; }
.meter .val { font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
.status { font-weight: 600; white-space: nowrap; }
.status.pass { color: var(--good-text); } .status.fail { color: var(--critical-text); }
.filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin: 8px 0 16px; }
.filters label { display: flex; flex-direction: column; font-size: 13px; color: var(--text-2); }
select, button { font: inherit; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--surface-2); color: var(--text); }
.case { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin: 12px 0; }
.case header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
.diff { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 8px 0; }
.diff .lbl { color: var(--text-2); font-size: 13px; }
.w { padding: 0 2px; border-radius: 3px; }
.w.del { background: var(--del-bg); text-decoration: line-through; }
.w.ins { background: var(--ins-bg); text-decoration: underline; }
.w.sub { background: var(--sub-bg); }
.kv { font-size: 13px; } .kv b { font-weight: 600; }
audio { height: 32px; max-width: 100%; }
.legend { font-size: 13px; color: var(--text-2); }
.tag { display: inline-block; font-size: 12px; font-weight: 600; line-height: 1.4; padding: 0 6px;
  border: 1px solid var(--warn-border); background: var(--warn-bg); border-radius: 4px; }
code.name { overflow-wrap: anywhere; }
</style>
</head>
<body>
<header class="top"><a href="/">VoiceBench</a> <span class="muted small">· evaluation runs</span></header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
